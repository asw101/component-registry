name: Build, Test & Release (asw101-1)

on:
  push:
    branches:
      - claude/build-test-release-asw101-QtkNA
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Dwarnings
    steps:
      - name: Checkout asw101-1
        uses: actions/checkout@v6
        with:
          ref: asw101-1

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set sccache env vars
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: Install sqlite3def
        run: cargo xtask sql install

      - name: Run xtask test
        run: cargo xtask test

      - name: Check docs
        run: cargo doc --no-deps --workspace

  build-release:
    name: Build release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
            cross: true
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout asw101-1
        uses: actions/checkout@v6
        with:
          ref: asw101-1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cross && matrix.target || '' }}

      - name: Install cross-compilation tools (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Set cross-linker env (aarch64-linux)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"

      - name: Run sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Set sccache env vars
        shell: bash
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --package component ${{ matrix.cross && format('--target {0}', matrix.target) || '' }}

      - name: Package binary (unix)
        if: matrix.archive == 'tar.gz'
        run: |
          BIN_DIR=${{ matrix.cross && format('target/{0}/release', matrix.target) || 'target/release' }}
          tar czf component-${{ matrix.target }}.tar.gz -C "$BIN_DIR" component

      - name: Package binary (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/component.exe -DestinationPath component-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: component-${{ matrix.target }}
          path: component-${{ matrix.target }}.${{ matrix.archive }}

  pre-release:
    name: Create pre-release
    runs-on: ubuntu-latest
    needs: [build-and-test, build-release]
    permissions:
      contents: write
    steps:
      - name: Checkout asw101-1
        uses: actions/checkout@v6
        with:
          ref: asw101-1
          fetch-depth: 0

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check if pre-release tag already exists
        id: tag-check
        run: |
          TAG="asw101-1-pre-${{ steps.sha.outputs.short }}"
          if git ls-remote --tags --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all binary artifacts
        if: steps.tag-check.outputs.exists != 'true'
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release assets
        if: steps.tag-check.outputs.exists != 'true'
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) \
            -exec mv {} release-assets/ \;
          cp scripts/install.sh release-assets/install.sh
          cp scripts/install.ps1 release-assets/install.ps1
          ls -la release-assets/

      - name: Create pre-release
        if: steps.tag-check.outputs.exists != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "asw101-1-pre-${{ steps.sha.outputs.short }}"
          name: "asw101-1 pre-release (${{ steps.sha.outputs.short }})"
          prerelease: true
          generate_release_notes: false
          body: |
            Pre-release build of branch `asw101-1` at commit `${{ steps.sha.outputs.short }}`.

            **Changes in this branch (over main):**
            - `NativeCertHooksP2`: outbound HTTPS for WASI P2 components (TinyGo / jco) behind TLS inspection proxies
            - `WasiHttpViewP3`: run library components using `wasi:http/client@0.3.0-rc-2026-03-15`
            - `wit.rs`: skip `exports` interface to hide componentize-py/js internal bootstrap from sub-CLI
          files: release-assets/*
